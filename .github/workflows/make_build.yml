# For syntax, see https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Build Godot Dockit

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, for example v1.0.1.
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      asset: ${{ steps.meta.outputs.asset }}
    steps:
      # Fail fast so a typo in the tag does not waste a full matrix build.
      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$(printf '%s' "$INPUT_TAG" | tr -d '[:space:]')"
          else
            tag="$REF_NAME"
          fi
          if [ -z "$tag" ]; then
            echo "::error::Enter a release tag such as v1.0.1."
            exit 1
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9A-Za-z._-]+$'; then
            echo "::error::Release tags must start with 'v' and use only letters, digits, '.', '_' or '-' (received '$tag')."
            exit 1
          fi
          asset="godot-dockit-$tag.zip"
          {
            echo "tag=$tag"
            echo "asset=$asset"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$tag asset=$asset"

      - name: Reject an existing manual tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Choose another tag or push the existing one."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target.platform }} / ${{ matrix.target.arch }} / ${{ matrix.target-type }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # A build is made for every possible combination of parameters
        # You can add or remove entries from the arrays of each parameter to customize which builds you want to run.
        # See https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow
        target:
          [
            { platform: linux, arch: x86_64, os: ubuntu-22.04 },
            { platform: linux, arch: x86_32, os: ubuntu-22.04 },
            { platform: linux, arch: arm64, os: ubuntu-22.04-arm },
            { platform: linux, arch: arm32, os: ubuntu-22.04-arm },
            { platform: windows, arch: x86_64, os: windows-latest },
            { platform: windows, arch: x86_32, os: windows-latest },
            { platform: windows, arch: arm64, os: windows-latest },
            { platform: macos, arch: universal, os: macos-latest },
            { platform: android, arch: x86_64, os: ubuntu-22.04 },
            { platform: android, arch: x86_32, os: ubuntu-22.04 },
            { platform: android, arch: arm64, os: ubuntu-22.04 },
            { platform: android, arch: arm32, os: ubuntu-22.04 },
            { platform: ios, arch: arm64, os: macos-latest },
            { platform: web, arch: wasm32, os: ubuntu-22.04 },
          ]
        target-type: [template_debug, template_release]

    runs-on: ${{ matrix.target.os }}
    steps:
      # Clone this repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build Dockit
        uses: ./.github/actions/build-extension
        with:
          platform: ${{ matrix.target.platform }}
          arch: ${{ matrix.target.arch }}
          target: ${{ matrix.target-type }}
          precision: single

      - name: Stage Build Artifact
        run: python scripts/package_addon.py stage artifact ${{ matrix.target.platform }} ${{ matrix.target.arch }} ${{ matrix.target-type }}

      # Upload the build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-dockit-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          if-no-files-found: error
          overwrite: true
          path: artifact/

  package:
    name: Verify and package addon
    runs-on: ubuntu-22.04
    needs: [prepare, build]
    env:
      ASSET: ${{ needs.prepare.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Download Target Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: godot-dockit-*
          merge-multiple: true
          path: artifact/

      - name: Verify and Assemble Addon
        run: python3 scripts/package_addon.py assemble artifact

      - name: Create and verify release archive
        run: |
          set -euo pipefail
          mkdir -p release
          (cd artifact && zip -qr "../release/$ASSET" .)
          unzip -tq "release/$ASSET"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: godot-dockit-release
          if-no-files-found: error
          path: release/${{ needs.prepare.outputs.asset }}

  release:
    name: Publish GitHub Release
    needs: [prepare, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download verified release archive
        uses: actions/download-artifact@v4
        with:
          name: godot-dockit-release
          path: release/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ASSET: ${{ needs.prepare.outputs.asset }}
        run: |
          set -euo pipefail
          args=("$TAG" "release/$ASSET" --repo "$GITHUB_REPOSITORY" --generate-notes)
          if [ "$EVENT_NAME" = "push" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
