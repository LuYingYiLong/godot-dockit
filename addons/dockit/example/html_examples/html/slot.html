<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Slot example</title>
    <style>
        x-slot-card {
            display: block;
        }
    </style>
    <script type="text/gdscript" component="x-slot-card" src="../behavior_scripts/slot.gd"></script>
</head>

<body>
    <h1>Slot example</h1>
    <p>The heading uses a named slot. The paragraph uses the default slot.</p>

    <x-slot-card>
        <template shadowrootmode="open">
            <h2>
                <slot id="title-slot" name="title">Default title</slot>
            </h2>
            <slot>Default content</slot>
            <p id="status" role="status"></p>
            <button id="toggle-title" type="button">Toggle title</button>
        </template>
        <span slot="title">A slotted title</span>
        <p>This paragraph is assigned to the default slot.</p>
    </x-slot-card>
</body>

</html>
