<!DOCTYPE html>

<style>
	label,
	textarea {
		font-size: 0.8rem;
		letter-spacing: 1px;
	}

	textarea {
		padding: 10px;
		max-width: 100%;
		line-height: 1.5;
		border-radius: 5px;
		border: 1px solid #cccccc;
		box-shadow: 1px 1px 1px #999999;
	}

	label {
		display: block;
		margin-bottom: 10px;
	}
</style>

<label for="story">Tell us your story:</label>

<textarea id="story" name="story" rows="5" cols="33">
It was a dark and stormy night...
</textarea>
